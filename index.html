<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<meta name="theme-color" content="#3B6D11">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Mis Hábitos</title>
<style>
  :root {
    --green: #3B6D11; --green-l: #639922; --green-bg: #EAF3DE; --green-mid: #C0DD97;
    --red: #993C1D; --red-l: #D85A30; --red-bg: #FAECE7; --red-mid: #F5C4B3;
    --amber: #BA7517; --amber-bg: #FAEEDA; --amber-mid: #FAC775;
    --surface: #f7f6f2; --card: #ffffff; --border: rgba(0,0,0,0.09);
    --text: #1a1a18; --text2: #6b6b67; --text3: #9e9e9a;
    --radius: 18px; --radius-sm: 12px;
    --safe-top: env(safe-area-inset-top);
    --safe-bot: env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --green: #97C459; --green-l: #C0DD97; --green-bg: #1a2e0a; --green-mid: #27500A;
      --red: #F09595; --red-l: #F5C4B3; --red-bg: #2e0f0a; --red-mid: #711B13;
      --amber: #FAC775; --amber-bg: #2a1f08; --amber-mid: #633806;
      --surface: #111110; --card: #1c1c1a; --border: rgba(255,255,255,0.09);
      --text: #f0ede8; --text2: #9e9e9a; --text3: #6b6b67;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--surface); color: var(--text); font-family: -apple-system, 'SF Pro Display', sans-serif; }

  .app {
    max-width: 430px; margin: 0 auto;
    min-height: 100dvh;
    display: flex; flex-direction: column;
    padding-top: calc(var(--safe-top) + 8px);
    padding-bottom: calc(var(--safe-bot) + 70px);
  }

  /* TOP BAR */
  .top-bar {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 12px 20px 8px;
  }
  .app-title { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
  .date-chip {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 12px;
    font-size: 12px; color: var(--text2); font-weight: 500;
    margin-top: 4px;
  }

  /* NAV TABS */
  .nav-tabs {
    display: flex; gap: 0; margin: 8px 20px 0;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 4px;
  }
  .nav-tab {
    flex: 1; padding: 9px 0; font-size: 14px; font-weight: 600;
    border: none; background: transparent; cursor: pointer;
    border-radius: 14px; color: var(--text2); transition: all 0.2s;
    letter-spacing: -0.2px;
  }
  .nav-tab.active {
    background: var(--surface); color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  /* SCROLL AREA */
  .scroll-area { flex: 1; overflow-y: auto; padding: 16px 0 0; }

  /* SECTION */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px 10px;
  }
  .section-title { font-size: 13px; font-weight: 600; color: var(--text2); letter-spacing: 0.5px; text-transform: uppercase; }
  .section-dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-green { background: var(--green-l); }
  .dot-red { background: var(--red-l); }

  /* HABITS GRID */
  .habits-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 12px; padding: 0 16px 4px;
  }

  /* HABIT CARD */
  .habit-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 12px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    position: relative; transition: transform 0.12s;
    cursor: default; user-select: none;
  }
  .habit-card:active { transform: scale(0.97); }

  .habit-name {
    font-size: 13px; font-weight: 600; color: var(--text);
    text-align: center; line-height: 1.3;
  }
  .habit-streak {
    font-size: 11px; color: var(--text3);
    display: flex; align-items: center; gap: 3px;
  }
  .habit-streak.hot { color: var(--amber); }

  /* CIRCLE BUTTON */
  .circle-btn {
    width: 72px; height: 72px; border-radius: 50%;
    border: none; cursor: pointer; background: transparent;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .circle-btn svg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .circle-bg { fill: none; stroke-width: 5; }
  .circle-fill { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 0.45s cubic-bezier(.4,0,.2,1); }
  .circle-inner { position: relative; z-index: 1; text-align: center; }
  .circle-count { font-size: 24px; font-weight: 700; line-height: 1; }
  .circle-label { font-size: 9px; font-weight: 500; opacity: 0.55; margin-top: 1px; }

  .positive .circle-btn { background: var(--green-bg); }
  .positive .circle-bg { stroke: var(--green-mid); }
  .positive .circle-fill { stroke: var(--green-l); }
  .positive .circle-count { color: var(--green); }

  .negative .circle-btn { background: var(--red-bg); }
  .negative .circle-bg { stroke: var(--red-mid); }
  .negative .circle-fill { stroke: var(--red-l); }
  .negative .circle-count { color: var(--red); }

  /* DELETE LONG PRESS INDICATOR */
  .delete-overlay {
    position: absolute; inset: 0; border-radius: var(--radius);
    background: rgba(220,60,40,0.08); display: none;
    align-items: center; justify-content: center; z-index: 5;
  }
  .habit-card.long-pressed .delete-overlay { display: flex; }
  .delete-btn-big {
    background: #D85A30; color: white; border: none; border-radius: 10px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }

  /* ADD CARD */
  .add-card {
    background: transparent; border: 1.5px dashed var(--border);
    border-radius: var(--radius); padding: 16px 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; cursor: pointer; min-height: 150px;
    color: var(--text3); font-size: 13px; font-weight: 500;
    transition: all 0.2s; -webkit-tap-highlight-color: transparent;
  }
  .add-card:active { background: var(--card); }
  .add-icon { font-size: 26px; line-height: 1; }

  /* STREAK SECTION */
  .streak-section { padding: 20px 20px 0; }
  .streak-row {
    display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: none;
  }
  .streak-row::-webkit-scrollbar { display: none; }
  .streak-chip {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px;
    display: flex; flex-direction: column; align-items: center;
    min-width: 80px; gap: 4px; flex-shrink: 0;
  }
  .streak-chip.on-fire { border-color: var(--amber-mid); background: var(--amber-bg); }
  .streak-num { font-size: 22px; font-weight: 700; color: var(--text); }
  .streak-chip.on-fire .streak-num { color: var(--amber); }
  .streak-name { font-size: 11px; color: var(--text2); text-align: center; max-width: 72px; line-height: 1.2; font-weight: 500; }
  .streak-icon { font-size: 16px; line-height: 1; }

  /* STATS TAB */
  .stats-wrap { padding: 16px 20px 0; }
  .period-pills {
    display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .period-pill {
    padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text2); cursor: pointer; transition: all 0.15s;
  }
  .period-pill.active { background: var(--text); color: var(--surface); border-color: var(--text); }

  .stat-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    margin-bottom: 10px;
  }
  .stat-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .stat-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .stat-badge {
    font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600;
  }
  .badge-pos { background: var(--green-bg); color: var(--green); }
  .badge-neg { background: var(--red-bg); color: var(--red); }
  .stat-bar-bg { height: 7px; background: var(--surface); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .stat-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .fill-pos { background: var(--green-l); }
  .fill-neg { background: var(--red-l); }
  .stat-bottom { display: flex; justify-content: space-between; font-size: 12px; color: var(--text2); font-weight: 500; }
  .stat-streak-row { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text2); display: flex; gap: 16px; }
  .stat-streak-val { font-weight: 700; color: var(--amber); }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.35); z-index: 100;
    align-items: flex-end; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 24px 24px 0 0;
    padding: 24px 20px calc(24px + var(--safe-bot));
    width: 100%; max-width: 430px;
    border: 1px solid var(--border); border-bottom: none;
  }
  .modal-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 20px; }
  .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
  .modal input[type=text] {
    width: 100%; padding: 13px 16px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface);
    font-size: 16px; color: var(--text); margin-bottom: 14px;
    -webkit-appearance: none; outline: none;
  }
  .modal input[type=text]:focus { border-color: var(--green-l); }
  .type-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .type-opt { flex: 1; }
  .type-opt input[type=radio] { display: none; }
  .type-opt label {
    display: block; padding: 12px 8px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); cursor: pointer;
    font-size: 13px; font-weight: 600; text-align: center; color: var(--text2);
    transition: all 0.15s;
  }
  .type-opt input[type=radio]:checked + label.pos-lbl { border-color: var(--green-l); background: var(--green-bg); color: var(--green); }
  .type-opt input[type=radio]:checked + label.neg-lbl { border-color: var(--red-l); background: var(--red-bg); color: var(--red); }
  .limit-row { margin-bottom: 18px; }
  .limit-label { font-size: 13px; color: var(--text2); font-weight: 500; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .limit-label span { font-weight: 700; color: var(--text); }
  input[type=range] { width: 100%; accent-color: var(--green-l); }
  .modal-actions { display: flex; gap: 8px; }
  .btn-cancel {
    flex: 1; padding: 14px; border-radius: var(--radius-sm);
    background: var(--surface); border: 1px solid var(--border);
    font-size: 15px; font-weight: 600; color: var(--text2); cursor: pointer;
  }
  .btn-save {
    flex: 2; padding: 14px; border-radius: var(--radius-sm);
    background: var(--green); border: none;
    font-size: 15px; font-weight: 700; color: white; cursor: pointer;
  }

  /* TOAST */
  .toast {
    position: fixed; bottom: calc(80px + var(--safe-bot)); left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--surface);
    border-radius: 20px; padding: 11px 20px;
    font-size: 14px; font-weight: 600;
    opacity: 0; transition: all 0.3s; z-index: 200; white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* INSTALL BANNER */
  .install-banner {
    margin: 12px 20px 0;
    background: var(--card); border: 1px solid var(--green-mid);
    border-radius: var(--radius-sm); padding: 12px 14px;
    font-size: 13px; color: var(--text2); line-height: 1.5;
    display: none;
  }
  .install-banner strong { color: var(--text); }
  .install-banner .close-banner { float: right; cursor: pointer; color: var(--text3); font-size: 16px; margin-left: 8px; }

  /* PUNCH ANIM */
  @keyframes punch { 0%,100%{transform:scale(1)} 40%{transform:scale(0.86)} }
  .punching { animation: punch 0.22s ease; }

  /* EMPTY */
  .empty { text-align: center; padding: 30px 20px; color: var(--text3); font-size: 14px; }

  /* BOTTOM NAV PLACEHOLDER */
  .bottom-nav-spacer { height: 10px; }

  /* SECTION SEPARATOR */
  .section-sep { height: 20px; }

  /* STREAK SECTION TITLE */
  .section-sub { font-size: 13px; font-weight: 600; color: var(--text2); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="app">

  <div class="top-bar">
    <div>
      <div class="app-title">Mis Hábitos</div>
      <div class="date-chip" id="date-chip"></div>
    </div>
    <div style="font-size:28px; line-height:1; margin-top:4px">🌱</div>
  </div>

  <div id="install-banner" class="install-banner">
    <span class="close-banner" onclick="document.getElementById('install-banner').style.display='none'">✕</span>
    <strong>Instalar en iPhone:</strong> Toca el botón <strong>Compartir ↑</strong> en Safari → <strong>"Agregar a pantalla de inicio"</strong>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('habitos',this)">Hábitos</button>
    <button class="nav-tab" onclick="switchTab('rachas',this)">Rachas</button>
    <button class="nav-tab" onclick="switchTab('stats',this)">Estadísticas</button>
  </div>

  <!-- HABITOS TAB -->
  <div id="tab-habitos" class="scroll-area">
    <div class="section-header">
      <div class="section-title">✅ Positivos</div>
      <div class="section-dot dot-green"></div>
    </div>
    <div class="habits-grid" id="grid-positive"></div>

    <div class="section-sep"></div>

    <div class="section-header">
      <div class="section-title">🚫 A eliminar</div>
      <div class="section-dot dot-red"></div>
    </div>
    <div class="habits-grid" id="grid-negative"></div>
  </div>

  <!-- RACHAS TAB -->
  <div id="tab-rachas" class="scroll-area" style="display:none">
    <div style="padding:0 20px">
      <div class="section-sub">🔥 Racha actual</div>
      <div id="streaks-current"></div>
      <div class="section-sep"></div>
      <div class="section-sub">🏆 Mejor racha histórica</div>
      <div id="streaks-best"></div>
      <div class="section-sep"></div>
      <div class="section-sub">📅 Actividad esta semana</div>
      <div id="week-calendar"></div>
    </div>
  </div>

  <!-- STATS TAB -->
  <div id="tab-stats" class="scroll-area" style="display:none">
    <div class="stats-wrap">
      <div class="period-pills">
        <button class="period-pill active" onclick="setPeriod('today',this)">Hoy</button>
        <button class="period-pill" onclick="setPeriod('week',this)">7 días</button>
        <button class="period-pill" onclick="setPeriod('month',this)">30 días</button>
        <button class="period-pill" onclick="setPeriod('all',this)">Total</button>
      </div>
      <div id="stats-content"></div>
    </div>
  </div>

</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="modal" onclick="handleModalClick(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Nuevo hábito</h3>
    <input type="text" id="h-name" placeholder="Nombre del hábito..." maxlength="30">
    <div class="type-row">
      <div class="type-opt">
        <input type="radio" name="htype" id="r-pos" value="positive" checked>
        <label for="r-pos" class="pos-lbl">✅ Positivo</label>
      </div>
      <div class="type-opt">
        <input type="radio" name="htype" id="r-neg" value="negative">
        <label for="r-neg" class="neg-lbl">🚫 A eliminar</label>
      </div>
    </div>
    <div class="limit-row">
      <div class="limit-label">Meta diaria <span id="limit-disp">5 veces</span></div>
      <input type="range" id="h-limit" min="1" max="30" value="5"
        oninput="document.getElementById('limit-disp').textContent=this.value+' '+(this.value==1?'vez':'veces')">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveHabit()">Guardar hábito</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────────
let habits = [];
let logs   = [];   // [{id, habitId, date:'YYYY-MM-DD', ts:timestamp}]
let currentPeriod = 'today';
let pendingType = 'positive';
let longPressTimer = null;

const todayStr = () => new Date().toISOString().slice(0,10);

function save() {
  try {
    localStorage.setItem('hb_habits', JSON.stringify(habits));
    localStorage.setItem('hb_logs',   JSON.stringify(logs));
  } catch(e){}
}

function load() {
  try { habits = JSON.parse(localStorage.getItem('hb_habits')) || []; } catch(e){ habits=[]; }
  try { logs   = JSON.parse(localStorage.getItem('hb_logs'))   || []; } catch(e){ logs=[]; }
  // reset daily counts
  const today = todayStr();
  habits.forEach(h => { if (h.lastDate !== today) { h.countToday=0; h.lastDate=today; } });
  save();
}

// ── STREAKS ───────────────────────────────────────
// A "day counts" for a habit means: at least 1 log on that date
function getDayLogs(habitId) {
  const days = {};
  logs.filter(l => l.habitId===habitId).forEach(l => { days[l.date] = (days[l.date]||0)+1; });
  return days;
}

function currentStreak(habitId) {
  const days = getDayLogs(habitId);
  let streak = 0;
  const d = new Date(); 
  // if no log today, start from yesterday
  if (!days[todayStr()]) d.setDate(d.getDate()-1);
  while (true) {
    const key = d.toISOString().slice(0,10);
    if (!days[key]) break;
    streak++;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function bestStreak(habitId) {
  const days = Object.keys(getDayLogs(habitId)).sort();
  if (!days.length) return 0;
  let best=1, cur=1;
  for (let i=1;i<days.length;i++) {
    const prev = new Date(days[i-1]); prev.setDate(prev.getDate()+1);
    if (prev.toISOString().slice(0,10) === days[i]) { cur++; best=Math.max(best,cur); }
    else cur=1;
  }
  return best;
}

// ── RENDER: HABITS ────────────────────────────────
function renderHabits() {
  const pos = habits.filter(h=>h.type==='positive');
  const neg = habits.filter(h=>h.type==='negative');
  renderGrid('grid-positive', pos, 'positive');
  renderGrid('grid-negative', neg, 'negative');
}

function renderGrid(gridId, list, type) {
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';

  list.forEach(h => {
    const pct = Math.min(h.countToday / h.limit, 1);
    const R = 29, C = 2*Math.PI*R;
    const offset = C*(1-pct);
    const str = currentStreak(h.id);

    const card = document.createElement('div');
    card.className = 'habit-card '+type;
    card.id = 'card-'+h.id;
    card.innerHTML = `
      <div class="delete-overlay">
        <button class="delete-btn-big" onclick="deleteHabit('${h.id}')">Eliminar hábito</button>
      </div>
      <div class="habit-name">${esc(h.name)}</div>
      <button class="circle-btn" id="cbtn-${h.id}" onclick="tap('${h.id}')" aria-label="Registrar ${esc(h.name)}">
        <svg viewBox="0 0 68 68">
          <circle class="circle-bg" cx="34" cy="34" r="${R}"
            stroke-dasharray="${C}" stroke-dashoffset="0"/>
          <circle class="circle-fill" cx="34" cy="34" r="${R}" id="arc-${h.id}"
            stroke-dasharray="${C}" stroke-dashoffset="${offset}"/>
        </svg>
        <div class="circle-inner">
          <span class="circle-count" id="cnt-${h.id}">${h.countToday}</span>
          <span class="circle-label">/ ${h.limit}</span>
        </div>
      </button>
      <div class="habit-streak${str>=3?' hot':''}">
        ${str>=3?'🔥':'📅'} ${str} día${str!==1?'s':''} seguido${str!==1?'s':''}
      </div>
    `;

    // Long press to delete
    card.addEventListener('touchstart', () => {
      longPressTimer = setTimeout(() => card.classList.add('long-pressed'), 600);
    }, {passive:true});
    card.addEventListener('touchend', () => clearTimeout(longPressTimer));
    card.addEventListener('touchmove', () => clearTimeout(longPressTimer));
    document.addEventListener('click', (e) => {
      if (!card.contains(e.target)) card.classList.remove('long-pressed');
    });

    grid.appendChild(card);
  });

  // Add button
  const addCard = document.createElement('button');
  addCard.className = 'add-card';
  addCard.setAttribute('aria-label','Agregar hábito');
  addCard.onclick = () => openModal(type);
  addCard.innerHTML = `<div class="add-icon">＋</div><div>Agregar</div>`;
  grid.appendChild(addCard);
}

// ── TAP ───────────────────────────────────────────
function tap(id) {
  const h = habits.find(x=>x.id===id);
  if (!h) return;
  h.countToday++;
  logs.push({ id:'l'+Date.now()+Math.random(), habitId:id, date:todayStr(), ts:Date.now() });
  save();

  // Update circle
  const R=29, C=2*Math.PI*R;
  const pct = Math.min(h.countToday/h.limit,1);
  const arc = document.getElementById('arc-'+id);
  const cnt = document.getElementById('cnt-'+id);
  const btn = document.getElementById('cbtn-'+id);
  if (arc) arc.style.strokeDashoffset = C*(1-pct);
  if (cnt) cnt.textContent = h.countToday;

  // Animate
  if (btn) {
    btn.classList.remove('punching');
    void btn.offsetWidth;
    btn.classList.add('punching');
    btn.addEventListener('animationend', ()=>btn.classList.remove('punching'), {once:true});
  }

  // Update streak display
  const str = currentStreak(id);
  const card = document.getElementById('card-'+id);
  if (card) {
    const sd = card.querySelector('.habit-streak');
    if (sd) {
      sd.className = 'habit-streak'+(str>=3?' hot':'');
      sd.textContent = (str>=3?'🔥':'📅')+' '+str+' día'+(str!==1?'s':'')+' seguido'+(str!==1?'s':'');
    }
  }

  if (h.countToday === h.limit) showToast('¡Meta cumplida! '+h.name+' 🎉');
  else if (h.countToday === 1 && str > 1) showToast('🔥 ¡'+str+' días seguidos!');
}

// ── RENDER: RACHAS ────────────────────────────────
function renderRachas() {
  // Current streaks
  const cur = document.getElementById('streaks-current');
  const best = document.getElementById('streaks-best');
  const wk = document.getElementById('week-calendar');

  if (!habits.length) {
    cur.innerHTML = '<div class="empty">Agrega hábitos para ver tus rachas</div>';
    best.innerHTML=''; wk.innerHTML=''; return;
  }

  // Current streak cards
  const sorted = [...habits].sort((a,b)=>currentStreak(b.id)-currentStreak(a.id));
  cur.innerHTML = '<div class="streak-row">'+sorted.map(h=>{
    const s = currentStreak(h.id);
    const fire = s>=3;
    return `<div class="streak-chip${fire?' on-fire':''}">
      <div class="streak-icon">${fire?'🔥':'📅'}</div>
      <div class="streak-num">${s}</div>
      <div class="streak-name">${esc(h.name)}</div>
    </div>`;
  }).join('')+'</div>';

  // Best streaks
  const sortedBest = [...habits].sort((a,b)=>bestStreak(b.id)-bestStreak(a.id));
  best.innerHTML = '<div class="streak-row">'+sortedBest.map(h=>{
    const s = bestStreak(h.id);
    return `<div class="streak-chip${s>=7?' on-fire':''}">
      <div class="streak-icon">${s>=7?'🏆':s>=3?'⭐':'📌'}</div>
      <div class="streak-num">${s}</div>
      <div class="streak-name">${esc(h.name)}</div>
    </div>`;
  }).join('')+'</div>';

  // Week calendar
  const days7 = [];
  const dNames = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  for (let i=6;i>=0;i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    days7.push({ key: d.toISOString().slice(0,10), label: dNames[d.getDay()] });
  }

  let calHtml = '<div style="display:flex;flex-direction:column;gap:10px;">';
  habits.forEach(h => {
    const dayLogs = getDayLogs(h.id);
    calHtml += `<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;">
      <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;">${esc(h.name)}</div>
      <div style="display:flex;gap:6px;">`;
    days7.forEach(d => {
      const count = dayLogs[d.key] || 0;
      const done = count > 0;
      const isToday = d.key === todayStr();
      const color = done ? (h.type==='positive'?'var(--green-l)':'var(--red-l)') : 'var(--border)';
      calHtml += `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
        <div style="width:32px;height:32px;border-radius:8px;background:${done?color:'var(--surface)'};border:1.5px solid ${color};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:${done?'white':isToday?'var(--text)':'var(--text3)'};">
          ${count||''}
        </div>
        <div style="font-size:10px;color:${isToday?'var(--text)':'var(--text3)'};font-weight:${isToday?700:400};">${d.label}</div>
      </div>`;
    });
    calHtml += '</div></div>';
  });
  calHtml += '</div>';
  wk.innerHTML = calHtml;
}

// ── RENDER: STATS ─────────────────────────────────
function renderStats() {
  const content = document.getElementById('stats-content');
  if (!habits.length) {
    content.innerHTML = '<div class="empty">Agrega hábitos para ver estadísticas</div>';
    return;
  }

  const today = todayStr();
  function inPeriod(date) {
    if (currentPeriod==='today') return date===today;
    const d = new Date(today);
    if (currentPeriod==='week')  { d.setDate(d.getDate()-6); return date>=d.toISOString().slice(0,10); }
    if (currentPeriod==='month') { d.setDate(d.getDate()-29); return date>=d.toISOString().slice(0,10); }
    return true;
  }
  const days = currentPeriod==='today'?1:currentPeriod==='week'?7:currentPeriod==='month'?30:
    Math.max(1,[...new Set(logs.map(l=>l.date))].length||1);

  let html = '';
  habits.forEach(h => {
    const count = logs.filter(l=>l.habitId===h.id && inPeriod(l.date)).length;
    const expected = h.limit * days;
    const pct = expected>0 ? Math.min(Math.round(count/expected*100),100) : 0;
    const curStr = currentStreak(h.id);
    const bstStr = bestStreak(h.id);

    html += `<div class="stat-card">
      <div class="stat-top">
        <div class="stat-name">${esc(h.name)}</div>
        <div class="stat-badge ${h.type==='positive'?'badge-pos':'badge-neg'}">${h.type==='positive'?'✅ Positivo':'🚫 Eliminar'}</div>
      </div>
      <div class="stat-bar-bg"><div class="stat-bar-fill ${h.type==='positive'?'fill-pos':'fill-neg'}" style="width:${pct}%"></div></div>
      <div class="stat-bottom">
        <span>${count} veces registradas</span>
        <span>${pct}% de la meta</span>
      </div>
      <div class="stat-streak-row">
        <span>Racha actual: <span class="stat-streak-val">${curStr}🔥</span></span>
        <span>Mejor racha: <span class="stat-streak-val">${bstStr}🏆</span></span>
      </div>
    </div>`;
  });
  content.innerHTML = html;
}

// ── UI HELPERS ────────────────────────────────────
function switchTab(name, btn) {
  ['habitos','rachas','stats'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = t===name?'block':'none';
  });
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if (name==='rachas') renderRachas();
  if (name==='stats')  renderStats();
}

function setPeriod(p, btn) {
  currentPeriod = p;
  document.querySelectorAll('.period-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderStats();
}

function openModal(type) {
  pendingType = type;
  document.getElementById('h-name').value='';
  document.getElementById('h-limit').value=5;
  document.getElementById('limit-disp').textContent='5 veces';
  document.getElementById(type==='positive'?'r-pos':'r-neg').checked=true;
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('h-name').focus(),200);
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function handleModalClick(e) { if (e.target===document.getElementById('modal')) closeModal(); }

function saveHabit() {
  const name = document.getElementById('h-name').value.trim();
  if (!name) { showToast('Escribe un nombre'); return; }
  const type = document.querySelector('input[name="htype"]:checked').value;
  const limit = parseInt(document.getElementById('h-limit').value)||5;
  habits.push({ id:'h'+Date.now(), name, type, limit, countToday:0, lastDate:todayStr() });
  save(); closeModal(); renderHabits();
  showToast('¡Hábito creado! 🌱');
}

function deleteHabit(id) {
  const h = habits.find(x=>x.id===id);
  if (!h) return;
  if (!confirm('¿Eliminar "'+h.name+'"?\nSe borrará todo su historial.')) return;
  habits = habits.filter(x=>x.id!==id);
  logs   = logs.filter(x=>x.habitId!==id);
  save(); renderHabits();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setDateLabel() {
  const d = new Date();
  const opts = {weekday:'long',day:'numeric',month:'long'};
  const str = d.toLocaleDateString('es-MX',opts);
  document.getElementById('date-chip').textContent = str.charAt(0).toUpperCase()+str.slice(1);
}

// ── PWA / INSTALL BANNER ──────────────────────────
function checkInstallBanner() {
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone === true;
  const dismissed = localStorage.getItem('banner_dismissed');
  if (isIOS && !isStandalone && !dismissed) {
    document.getElementById('install-banner').style.display='block';
  }
  document.querySelector('.close-banner')?.addEventListener('click',()=>{
    localStorage.setItem('banner_dismissed','1');
  });
}

// ── SERVICE WORKER ────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

// ── INIT ──────────────────────────────────────────
load();
setDateLabel();
renderHabits();
checkInstallBanner();
</script>
